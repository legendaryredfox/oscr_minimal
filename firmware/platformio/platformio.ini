; Projeto PlatformIO do dumper oscr_minimal (Arduino Mega 2560).
; Usa a biblioteca irmã ../oscr_serial (mesmo código do projeto Arduino).
[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_extra_dirs = ..
monitor_speed = 1000000
build_flags = -Wall -Wextra

; Firmware com leitura dos cartuchos (SNES, NES/Famicom, Mega Drive, GBA)
[env:megaatmega2560]

; Modo de teste: dados sintéticos, sem cartucho
[env:megaatmega2560_mock]
build_flags = ${env.build_flags} -DOSCR_MOCK
