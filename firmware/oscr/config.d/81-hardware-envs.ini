[env:SerialASCII]
extends =
  board:mega-embed
  hardware:serial:ascii
build_src_flags =
  ${this.arch.build_src_flags}
  ${this.mcu.build_src_flags}
  ${this.board.build_src_flags}
  ${this.output.build_src_flags}
  ${this.input.build_src_flags}
  -D HW_VERSION=${this.hardware.version}
build_flags =
  ${this.arch.build_flags}
  ${this.mcu.build_flags}
  ${this.board.build_flags}
  ${this.output.build_flags}
  ${this.input.build_flags}
  ; fork oscr_minimal (D245): fila de recepção da UART maior que um quadro do protocolo (até 530 bytes). Com os 64 bytes padrão,
  ; um bloco de 512 bytes vindo do PC a 1 Mbaud transbordava: o AVR não consome um byte a cada 10 µs. Potência de 2 (o ISR usa %).
  -D SERIAL_RX_BUFFER_SIZE=1024
extra_scripts =
  ${this.arch.extra_scripts}
  ${this.mcu.extra_scripts}
  ${this.board.extra_scripts}
  ${this.output.extra_scripts}
  ${this.input.extra_scripts}
lib_deps =
  ${this.arch.lib_deps}
  ${this.mcu.lib_deps}
  ${this.board.lib_deps}
  ${this.output.lib_deps}
  ${this.input.lib_deps}



