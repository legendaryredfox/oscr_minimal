;
; Ambiente do shield dumper (oscr_minimal) para placa com o seletor de tensão do cartucho (D138, LDO de 3,3 V e Q4 de bypass, comando no D18).
; O 5V dos slots fica sempre ligado (o desligamento por software foi retirado, D139). O firmware sobe em 5 V (padrão dos flashcarts comuns);
; 3,3 V é opção explícita (comando VOLT). O host avisa e pede confirmação ao passar de 3,3 V para 5 V num cartucho marcado como 3,3 V.
; Placas sem seletor usam o ambiente SerialASCII (sem este arquivo).
; Gravar com: pio run -e SerialASCII_Volt -t upload
;

[env:SerialASCII_Volt]
extends = env:SerialASCII
build_flags =
  ${env:SerialASCII.build_flags}
  -D OSCR_VOLT_SELECT=1
