;
; Ambiente do shield dumper (oscr_minimal) para placa com a chave de 5V dos slots em SOFTWARE (D115, D116; sem chave física, D123).
; Placa 16_bits v1.2 (Q1) e as demais v1.1: o firmware começa com o 5V desligado e o host liga (comando POWER).
; Gravar com: pio run -e SerialASCII_Power -t upload
;

[env:SerialASCII_Power]
extends = env:SerialASCII
build_flags =
  ${env:SerialASCII.build_flags}
  -D OSCR_POWER_SWITCH=1

; Placa com o sensor do rail no D53 e o transistor de descarga (v1.1 e 16_bits v1.3, D115 e D119): o LED amarelo (seguro trocar) e a espera
; curta depois de cortar o 5V. Gravar com: pio run -e SerialASCII_PowerSense -t upload
[env:SerialASCII_PowerSense]
extends = env:SerialASCII
build_flags =
  ${env:SerialASCII.build_flags}
  -D OSCR_POWER_SWITCH=1
  -D OSCR_POWER_SENSE=1
  -D OSCR_POWER_DISCHARGE=1
