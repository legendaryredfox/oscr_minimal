;
; Ambiente do shield dumper (oscr_minimal) para placa com a chave de 5V dos slots (D115, D116).
; Placa 16_bits v1.2 (Q1 em software), 16_bits v1.3 e as demais v1.1 (chave física): o firmware começa com o 5V
; desligado e o host liga (comando POWER). Gravar com: pio run -e SerialASCII_Power -t upload
;

[env:SerialASCII_Power]
extends = env:SerialASCII
build_flags =
  ${env:SerialASCII.build_flags}
  -D OSCR_POWER_SWITCH=1
