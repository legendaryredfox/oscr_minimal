;
; Ajustes do shield dumper (oscr_minimal). O PlatformIO carrega este arquivo depois de config.d/.
; Só SNES, NES/Famicom, Mega Drive, Master System (slot direto da placa megadrive_sms, D137) e GB/GBC/GBA (o núcleo gbx) e N64 (slot da placa n64 e da completa) ficam ligados.
;

[cores]
n64 = true
sms = true
selftest = true   ; autoteste do OSCR (SELFTEST, P-12): curtos entre os pinos, pull-up do D7 e Si5351
flash = true      ; funções de flash do OSCR (NES Maker, A29040B, flash repro e o programador de flash genérico)
flash16 = true    ; flash de 16 bits e EPROM do programador de flash genérico
