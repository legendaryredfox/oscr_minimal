;
; Ajustes do shield dumper (oscr_minimal). O PlatformIO carrega este arquivo depois de config.d/.
; Só SNES, NES/Famicom, Mega Drive, Master System (slot direto da placa megadrive_sms, D137) e GB/GBC/GBA (o núcleo gbx) e N64 (slot da placa n64 e da completa) ficam ligados.
;

[cores]
n64 = true
st = true         ; Sufami Turbo (adaptador no slot SNES): ler os slots A e B (F-10, D178)
gpc = true        ; Game Processor RAM Cassette do SNES: ler e gravar os 512 KB (F-10, D178)
satellaview = true ; BS-X: Memory Pack (1 MB) e SRAM de 32 KB do cartucho base (F-11, D187)
sfm = true        ; SF Memory Cassette: flash de 4 MB, mapeamento e jogos (F-11, D187)
sms = true
colv = true       ; ColecoVision: adaptador de 30 pinos no slot SNES, ler ROM (F-20, D201)
atari2600 = true     ; Atari 2600: adaptador de 24 pinos no slot SNES, 5 V, ler ROM pelo mapper (F-20, D206)
atari5200 = true   ; Atari 5200: adaptador no slot SNES, 5 V, ler ROM pelo mapper (F-20, D209)
atari8 = true      ; Atari 8 bits (400/800/XL/XE): adaptador no slot SNES, 5 V, ler ROM (F-20, D210)
atarijaguar = true ; Atari Jaguar: adaptador com 74HC595 (PE3, PE4, PE5, PG5), ler ROM (F-20, D211); o slot ainda não tem todos os pinos
atarilynx = true   ; Atari Lynx: adaptador de 34 pinos no slot SNES, 5 V, ler ROM (F-20, D210)
atari7800 = true   ; Atari 7800: adaptador no slot SNES, 5 V, ler ROM pelo mapper (F-20, D209)
vectrex = true   ; Vectrex: adaptador de 36 pinos no slot SNES, 5 V, ler ROM (F-20, D205)
rcastudio2 = true ; RCA Studio II: adaptador de 22 pinos no slot SNES, 5 V, ler ROM (F-20, D216)
ody2 = true  ; Magnavox Odyssey 2 / Videopac: adaptador de 30 pinos no slot SNES, 5 V, ler ROM (F-20, D226)
poke = true  ; Pokémon Mini: adaptador de 32 pinos no slot SNES, 3,3 V (o slot é 5 V fixo: precisa de LDO próprio), ler ROM (F-20, D227)
fairchild = true ; Fairchild Channel F: adaptador de 22 pinos no slot SNES, 5 V, ler ROM pelo protocolo ROMC (F-20, D224)
bally = true  ; Bally Astrocade: adaptador de 26 pinos no slot SNES, 5 V, ler ROM (F-20, D223)
pv1000 = true ; Casio PV-1000: adaptador de 36 pinos no slot SNES, 5 V, ler ROM (F-20, D219)
tommypyuuta = true ; Tomy Pyuuta: adaptador de 36 pinos no slot SNES, 5 V, ler ROM (F-20, D217)
supervision = true ; Watara Supervision: adaptador de 40 pinos no slot SNES, 3,3 V (o slot é 5 V fixo: precisa de LDO próprio), ler ROM (F-20, D218)
arc = true        ; Emerson Arcadia 2001: adaptador de 30 pinos no slot SNES, 5 V, ler ROM (F-20, D215)
ngp = true        ; Neo Geo Pocket: 3,3 V, ler ROM; o adaptador ainda não existe (F-20, D202)
selftest = true   ; autoteste do OSCR (SELFTEST, P-12): curtos entre os pinos, pull-up do D7 e Si5351
flash = true      ; funções de flash do OSCR (NES Maker, A29040B, flash repro e o programador de flash genérico)
flash16 = true    ; flash de 16 bits e EPROM do programador de flash genérico

[hardware]
clockgen = true   ; Si5351 da placa (header do módulo breakout): relógios do SA-1, SuperFX, SNES CIC etc.

[board:mega-embed]
monitor_speed = 1000000   ; baud do protocolo (D196): com ENABLE_STATIC_BAUD o begin(baud) ignora o argumento e usa OSCR_BAUD, que vinha de 250000
