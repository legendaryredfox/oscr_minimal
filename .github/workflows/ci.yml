name: ci
on: [push, pull_request]
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Testes do firmware (protocolo, Si5351, HAL do AVR com registradores simulados, cartuchos)
        run: make -C firmware/oscr_serial test
      - name: ASan + UBSan nos testes de cartuchos e de protocolo
        run: |
          cd firmware/oscr_serial
          g++ -std=c++11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -o /tmp/asan_carts tests/test_carts.cpp oscr_carts.cpp oscr_carts_snes.cpp oscr_carts_nes.cpp oscr_carts_md.cpp oscr_carts_gba.cpp oscr_carts_gb.cpp oscr_session.cpp oscr_proto.cpp
          g++ -std=c++11 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -o /tmp/asan_proto tests/test_proto.cpp oscr_proto.cpp oscr_session.cpp
          /tmp/asan_carts && /tmp/asan_proto
      - name: Compila o sketch para o Mega 2560
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:mega
          sketch-paths: firmware/arduino/oscr_dumper
          libraries: |
            - source-path: firmware/oscr_serial
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest pytest-cov pyserial
      - run: make -C firmware/oscr_serial build/sim_stdio
      - run: cd host && python -m pytest -q --cov=oscr_host
  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: "21" }
      - run: cd gui && ./gradlew :shared:jvmTest :desktopApp:compileKotlin
